name: Build JDC Prebuilt Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex-jdc-backup-tg

permissions:
  contents: write

jobs:
  build-linux-amd64:
    name: Build Linux amd64 Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set package version
        id: version
        run: |
          PACKAGE_VERSION="jdc-$(date +'%Y%m%d-%H%M%S')-$(git rev-parse --short HEAD)"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "value=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Build precompiled bundle
        run: |
          bash scripts/package_jdc_prebuilt_release.sh
        env:
          JDC_PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          JDC_TARGET_OS: linux
          JDC_TARGET_ARCH: amd64
          JDC_ARCHIVE_NAME: newapi-jdc-linux-amd64.tar.gz

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: newapi-jdc-linux-amd64
          path: |
            dist/newapi-jdc-linux-amd64.tar.gz
            dist/jdc-build-info.txt

      - name: Publish latest prebuilt release
        uses: ncipollo/release-action@v1
        with:
          tag: jdc-latest
          name: JDC Latest Prebuilt Bundle
          allowUpdates: true
          artifactErrorsFailBuild: true
          body: |
            Automated JDC prebuilt bundle.

            Version: `${{ steps.version.outputs.value }}`
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`
          artifacts: dist/newapi-jdc-linux-amd64.tar.gz,dist/jdc-build-info.txt
          generateReleaseNotes: false
          prerelease: true
          replacesArtifacts: true
